# Publication du site sur GitHub Pages.
#
# ⚠️ DÉCLENCHEMENT MANUEL UNIQUEMENT (`workflow_dispatch`).
# Rien n'est publié automatiquement à chaque commit : la mise en ligne est une
# décision, pas un effet de bord. Pour publier, aller dans l'onglet Actions du
# dépôt, choisir ce workflow, et cliquer « Run workflow ».
#
# Prérequis, à faire UNE FOIS dans Settings → Pages :
#   Source : « GitHub Actions »

name: Publier sur GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; on ne coupe pas celle en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # DEPLOIEMENT=pages bascule astro.config sur le sous-chemin du dépôt.
      - run: npm run build
        env:
          DEPLOIEMENT: pages

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
